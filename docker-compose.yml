name: fleet-ops

services:
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?falta POSTGRES_ADMIN_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?falta POSTGRES_ADMIN_PASSWORD en .env}
      FLEETOPS_DB_NAME: ${FLEETOPS_DB_NAME:?falta FLEETOPS_DB_NAME en .env}
      FLEETOPS_APP_USER: ${FLEETOPS_APP_USER:?falta FLEETOPS_APP_USER en .env}
      FLEETOPS_APP_PASSWORD: ${FLEETOPS_APP_PASSWORD:?falta FLEETOPS_APP_PASSWORD en .env}
      FLEETOPS_RO_USER: ${FLEETOPS_RO_USER:?falta FLEETOPS_RO_USER en .env}
      FLEETOPS_RO_PASSWORD: ${FLEETOPS_RO_PASSWORD:?falta FLEETOPS_RO_PASSWORD en .env}
      N8N_DB_NAME: ${N8N_DB_NAME:?falta N8N_DB_NAME en .env}
      N8N_DB_USER: ${N8N_DB_USER:?falta N8N_DB_USER en .env}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?falta N8N_DB_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.39.10
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME}
      DB_POSTGRESDB_USER: ${N8N_DB_USER}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?falta N8N_ENCRYPTION_KEY en .env}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: America/Mexico_City
      TZ: America/Mexico_City
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
    volumes:
      - n8n_data:/home/node/.n8n
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  n8n_data:
